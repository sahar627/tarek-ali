<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تحديث القرآن والأذكار</title>
<style>
:root{--bg:#0A100E;--surface:#121A17;--line:#2C3B35;--frame:#3E534B;--ink:#F0EBDD;
 --accent:#4FC9A5;--accent-dim:#16302A;--accent-line:#2E6B5B;--gold:#D9B26A;
 --gold-dim:#2A2418;--gold-line:#6B5326}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
 line-height:1.8;padding:22px 16px 40px}
.wrap{max-width:620px;margin:0 auto}
.card{background:var(--surface);border:2px solid var(--gold-line);border-radius:14px;padding:20px 16px;text-align:center}
h1{margin:0 0 4px;font-size:1.5rem}
.ver{display:inline-block;margin-top:10px;padding:9px 20px;border-radius:10px;
 background:var(--gold-dim);border:1px solid var(--gold-line);color:var(--gold);
 font-size:1.5rem;font-weight:800}
.lbl{font-size:.86rem;opacity:.75;margin-top:6px}
a.btn{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:16px;padding:16px;
 border-radius:12px;background:var(--gold);border:3px solid var(--gold-line);color:#1A1206;
 font-size:1.15rem;font-weight:700;text-decoration:none}
.note{margin-top:14px;padding:13px 14px;border-radius:10px;background:var(--accent-dim);
 border:1px solid var(--accent-line);font-size:.9rem;text-align:right}
.note b{color:var(--accent)}
ol{margin:8px 0 0;padding-inline-start:20px;font-size:.9rem}
li{margin-bottom:5px}
.back{display:block;text-align:center;margin-top:18px;color:var(--gold);font-size:.9rem;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>تحديث القرآن والأذكار</h1>
    <div class="lbl">آخر إصدار متاح</div>
    <div class="ver">٢٫٤</div>
    <a class="btn" href="quran-adhkar.apk" download>تنزيل آخر إصدار</a>
  </div>

  <div class="note">
    قارن هذا الرقم بالذي في إعدادات تطبيقك. إن تطابقا فأنت على الأحدث.
  </div>

  <a class="back" href="./">← رجوع إلى التطبيق</a>
</div>
</body>
</html>
