name: بناء ملف APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: نسخ أحدث نسخة من التطبيق إلى داخل الحزمة
        run: cp ../sahar-mushaf.html app/src/main/assets/index.html

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز أدوات أندرويد
        uses: android-actions/setup-android@v3

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: تجهيز مفتاح التوقيع (إن وُجد)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sahar.jks"
            echo "SAHAR_KEYSTORE=$RUNNER_TEMP/sahar.jks" >> "$GITHUB_ENV"
          fi

      - name: البناء
        env:
          SAHAR_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SAHAR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SAHAR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: رفع الملف الناتج
        uses: actions/upload-artifact@v4
        with:
          name: sahar-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
