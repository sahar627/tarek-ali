name: بناء ملف APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

# بناء واحد في كل مرة؛ الأحدث يلغي ما قبله فلا تتزاحم عمليات الدفع
concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: فحص تشخيصي — ماذا يوجد فعلاً
        run: |
          echo "=== جذر المستودع ==="
          ls -la
          echo "=== مجلد android ==="
          ls -la android || echo "!! لا يوجد مجلد android"
          echo "=== ملفات جافا ==="
          find android -name "*.java" 2>/dev/null || true
          echo "=== الأصول ==="
          ls -la android/app/src/main/assets 2>/dev/null || echo "!! لا توجد assets"
          echo "=== أدوات ==="
          java -version 2>&1 || true
          gradle --version 2>&1 | head -5 || echo "gradle غير مثبّت بعد"

      - name: تجهيز أصول التطبيق من ملفات المستودع
        run: |
          set -e
          mkdir -p android/app/src/main/assets/tafsir
          cp index.html android/app/src/main/assets/index.html
          python3 - <<'PY'
          import json, os
          d = json.load(open('tafsir.json', encoding='utf-8'))
          os.makedirs('android/app/src/main/assets/tafsir', exist_ok=True)
          for i, s in enumerate(d['text'], 1):
              json.dump(s, open(f'android/app/src/main/assets/tafsir/{i}.json', 'w', encoding='utf-8'),
                        ensure_ascii=False, separators=(',', ':'))
          print('قُسّم التفسير إلى', len(d['text']), 'ملفاً')
          PY
          ls -la android/app/src/main/assets | head
          du -sh android/app/src/main/assets

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز أدوات أندرويد
        uses: android-actions/setup-android@v3

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: تجهيز مفتاح التوقيع (اختياري)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KS:-}" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sahar.jks"
            echo "SAHAR_KEYSTORE=$RUNNER_TEMP/sahar.jks" >> "$GITHUB_ENV"
            echo "مفتاح خاص جاهز"
          else
            echo "بلا مفتاح خاص — سيُستعمل مفتاح التطوير"
          fi
          exit 0

      - name: البناء
        working-directory: android
        env:
          SAHAR_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SAHAR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SAHAR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: أين الناتج
        if: always()
        run: find android -name "*.apk" 2>/dev/null || echo "لم يُنتج أي APK"

      # ينشر الملف برابط ثابت لا يتغيّر، يفتحه أي أحد بلا حساب GitHub
      - name: نشر التطبيق برابط ثابت
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(find android -name "*.apk" | head -1)
          cp "$APK" quran-adhkar.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest quran-adhkar.apk \
            -t "القرآن والأذكار — آخر إصدار" \
            -n "تطبيق أندرويد: المصحف والأذكار ومواقيت الصلاة والأذان في وقته. بلا إعلانات وبلا إنترنت."

      # يضع نسخة من التطبيق داخل الموقع نفسه، فيُنزَّل من نفس النطاق الذي يفتحه المستخدم
      - name: نسخ التطبيق إلى الموقع
        run: |
          set -e
          APK=$(find android -name "*.apk" | head -1)
          cp "$APK" quran-adhkar.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f quran-adhkar.apk
          if git diff --cached --quiet; then
            echo "لا جديد في ملف التطبيق"
            exit 0
          fi
          git commit -m "تحديث تطبيق أندرويد"
          # الفرع قد يتحرّك أثناء البناء، فنعيد المحاولة بدل أن نفشل
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; }
            if git push origin HEAD:main; then
              echo "تم الدفع في المحاولة $i"
              exit 0
            fi
            echo "المحاولة $i لم تنجح — إعادة بعد قليل"
            sleep $((i * 6))
          done
          echo "تعذّر الدفع بعد خمس محاولات"
          exit 1

      - name: رفع الملف الناتج
        uses: actions/upload-artifact@v4
        with:
          name: sahar-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
